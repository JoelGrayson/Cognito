services:
  postgres:
    image: postgres:17-alpine
    container_name: hackmit2026-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: structured_learning
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d structured_learning"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
